<!doctype html>
<meta charset="utf-8">
<pre id="out">pending</pre>
<script type="module">
// Parity page: renders ?img=<url> with settings ?s=<json> through web/gl.js and prints the PNG as a data URL.
import { createRenderer, liveParams, loadSource } from "/web/gl.js";
const q = new URLSearchParams(location.search);
const out = document.getElementById("out");
try {
  const blob = await (await fetch(q.get("img"))).blob();
  const cv = document.createElement("canvas");
  const r = createRenderer(cv, (m, e) => { throw e; });
  if (!r) throw new Error("no webgl2");
  const image = await loadSource(blob);
  r.setImage(image);
  r.draw(liveParams(JSON.parse(q.get("s"))), image.source.width, image.source.height);
  out.textContent = cv.toDataURL("image/png"); // same task as draw(): the drawing buffer is still there
} catch (e) {
  out.textContent = "ERROR " + e.message;
}
</script>
